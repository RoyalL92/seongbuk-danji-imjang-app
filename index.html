<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="성북구 임장"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#F2F4F7"/>
<meta name="format-detection" content="telephone=no"/>
<title>성북구 임장</title>
<link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0%25' stop-color='%236366F1'/><stop offset='100%25' stop-color='%234F46E5'/></linearGradient></defs><rect width='180' height='180' rx='40' fill='url(%23g)'/><text x='90' y='118' font-family='-apple-system,BlinkMacSystemFont,sans-serif' font-size='72' font-weight='700' fill='white' text-anchor='middle' letter-spacing='-2'>SB</text></svg>"/>

<style>
  html, body { margin: 0; padding: 0; background: #F2F4F7; overscroll-behavior-y: contain; -webkit-text-size-adjust: 100%; -webkit-tap-highlight-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Pretendard", "Noto Sans KR", sans-serif; }
  body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  #root { min-height: 100vh; }
  .loading-screen { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #475569; font-size: 14px; gap: 12px; background: #F2F4F7; }
  .loading-screen .sp { width: 28px; height: 28px; border: 3px solid #E4E7EC; border-top-color: #4F46E5; border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  input, textarea, select { font-size: 16px; }
</style>
</head>
<body>
<div id="root">
  <div class="loading-screen">
    <div class="sp"></div>
    <div>앱을 준비하는 중...</div>
  </div>
</div>

const fmt만 = n => {
  if (n === undefined || n === null || n === '') return '-';
  const num = Number(n);
  if (isNaN(num)) return String(n);
  if (num >= 10000) {
    const 억 = Math.floor(num / 10000);
    const 천만 = num % 10000;
    return 천만 > 0 ? `${억}억 ${천만.toLocaleString()}` : `${억}억`;
  }
  return num.toLocaleString();
};
const pct = v => {
  if (v === undefined || v === null || v === '') return '-';
  const n = Number(v);
  if (isNaN(n)) return String(v);
  return `${(n * 100).toFixed(1)}%`;
};

const ORDER_KEY = 'sb_order_v1';
const CHECKS_KEY = 'sb_checks_v2'; // 통합 키: 모든 체크 데이터를 한 번에 저장
const CHECK_KEY_PREFIX = 'sb_check_'; // 구버전 키 (마이그레이션용)

// localStorage 직접 접근 (동기). window.storage가 있으면 그걸 사용하되 동기처럼.
function lsGet(key) {
  try {
    if (typeof localStorage !== 'undefined') return localStorage.getItem(key);
  } catch (e) {}
  return null;
}
function lsSet(key, value) {
  try {
    if (typeof localStorage !== 'undefined') localStorage.setItem(key, value);
  } catch (e) {}
}
function lsDelete(key) {
  try {
    if (typeof localStorage !== 'undefined') localStorage.removeItem(key);
  } catch (e) {}
}
function loadOrderSync() {
  const v = lsGet(ORDER_KEY);
  if (!v) return null;
  try {
    return JSON.parse(v);
  } catch (e) {
    return null;
  }
}
function saveOrderSync(order) {
  lsSet(ORDER_KEY, JSON.stringify(order));
}

// 모든 체크를 한 번에 읽기 (구버전 키들도 자동 흡수)
function loadAllChecksSync(totalCount) {
  // 1) 신버전 통합 키 우선
  const v = lsGet(CHECKS_KEY);
  if (v) {
    try {
      return JSON.parse(v) || {};
    } catch (e) {}
  }
  // 2) 구버전: sb_check_0, sb_check_1, ... 키들을 모아서 마이그레이션
  const out = {};
  let migrated = false;
  for (let i = 0; i < totalCount; i++) {
    const raw = lsGet(CHECK_KEY_PREFIX + String(i));
    if (raw) {
      try {
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === 'object' && Object.keys(parsed).length > 0) {
          out[i] = parsed;
          migrated = true;
        }
      } catch (e) {}
    }
  }
  if (migrated) {
    // 통합 키로 저장하고 구버전 키 정리
    lsSet(CHECKS_KEY, JSON.stringify(out));
    for (let i = 0; i < totalCount; i++) lsDelete(CHECK_KEY_PREFIX + String(i));
  }
  return out;
}
function saveAllChecksSync(checkMap) {
  lsSet(CHECKS_KEY, JSON.stringify(checkMap || {}));
}
function deleteAllChecksSync() {
  lsDelete(CHECKS_KEY);
}

    const touch = e.touches ? e.touches[0] : e;

      if (Math.abs(deltaY) > 8) cancelLongPress();
      return;
    }
    e.preventDefault?.();
    const elementsAtPoint = document.elementsFromPoint(touch.clientX, touch.clientY);
    const overCard = elementsAtPoint.find(el => el.dataset && el.dataset.cardIndex !== undefined);
    if (overCard) {
      const overIdx = parseInt(overCard.dataset.cardIndex, 10);

          --app-border-soft: #EEF1F4;

          --app-text-3: #94A3B8;
          --accent: #4F46E5;
          --accent-soft: #EEF0FF;
          --accent-deep: #3730A3;
          --buy: #DC2626;
          --buy-soft: #FEE2E2;
          --rent: #2563EB;
          --rent-soft: #DBEAFE;
          --warn: #B45309;
          --warn-soft: #FEF3C7;
          --good: #059669;
          --good-soft: #D1FAE5;
        }

        .phone-frame {
          min-height: 100vh;
          background: linear-gradient(180deg, #DDE3EE 0%, #C8D2E1 100%);
          display: flex;
          align-items: stretch;
          justify-content: center;
          padding: 0;
          font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "Pretendard", "Noto Sans KR", sans-serif;
        }
        .phone-screen {
          width: 100%;
          max-width: 480px;
          background: var(--app-bg);
          position: relative;
          overflow: hidden;
          box-shadow: 0 0 0 1px rgba(0,0,0,0.04), 0 30px 60px rgba(15, 23, 42, 0.12);
          min-height: 100vh;
        }

        .screen { width: 100%; min-height: 100vh; padding-bottom: 32px; user-select: none; -webkit-user-select: none; animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        .slide-in { animation: slideIn 0.22s cubic-bezier(0.32, 0.72, 0.34, 1); }
        @keyframes slideIn { from { transform: translateX(20%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* ===== Header ===== */
        .app-header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding: 16px 16px 12px;
          gap: 10px;
        }
        .header-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
        .brand-mark {
          width: 38px;
          height: 38px;
          border-radius: 11px;
          background: linear-gradient(135deg, #6366F1 0%, #4F46E5 100%);
          color: white;
          display: flex;
          align-items: center;
          justify-content: center;
          font-weight: 700;
          font-size: 13px;
          letter-spacing: -0.02em;
          box-shadow: 0 4px 10px rgba(79, 70, 229, 0.25);
          flex-shrink: 0;
        }
        .app-title {
          font-size: 19px;
          font-weight: 700;
          margin: 0;
          color: var(--app-text);
          letter-spacing: -0.02em;
          line-height: 1.1;
        }
        .app-sub {
          display: flex;
          gap: 5px;
          margin-top: 4px;
          flex-wrap: wrap;
        }
        .stat-pill {
          display: inline-flex;
          align-items: center;
          gap: 3px;
          font-size: 10.5px;
          color: var(--app-text-2);
          background: var(--app-surface);
          padding: 2px 7px;
          border-radius: 999px;
          border: 1px solid var(--app-border-soft);
          font-weight: 500;
        }
        .header-actions { display: flex; gap: 6px; flex-shrink: 0; }
        .icon-btn {
          width: 38px; height: 38px;
          border-radius: 11px;
          border: 1px solid var(--app-border-soft);
          background: var(--app-surface);
          display: flex; align-items: center; justify-content: center;
          color: var(--app-text);
          cursor: pointer;
          transition: all 0.15s;
        }
        .icon-btn:active { transform: scale(0.92); background: var(--app-surface-2); }

        /* ===== Search ===== */
        .search-bar {
          margin: 0 16px 12px;
          position: relative;
          display: flex;
          align-items: center;
          background: var(--app-surface);
          border: 1px solid var(--app-border-soft);
          border-radius: 12px;
          padding: 0 12px;
          height: 42px;
          animation: slideDown 0.2s ease-out;
        }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }
        .search-icon { color: var(--app-text-3); flex-shrink: 0; }
        .search-input {
          flex: 1;
          border: none;
          background: transparent;
          padding: 0 8px;
          font-size: 14px;
          color: var(--app-text);
          font-family: inherit;
          outline: none;
        }
        .search-input::placeholder { color: var(--app-text-3); }
        .search-clear {
          width: 22px; height: 22px;
          border-radius: 50%;
          border: none;
          background: var(--app-text-3);
          color: white;
          display: flex;
          align-items: center;
          justify-content: center;
          cursor: pointer;
        }

        /* ===== Settings sheet ===== */
        .settings-sheet {
          position: fixed;
          inset: 0;
          background: rgba(15, 23, 42, 0.4);
          z-index: 100;
          display: flex;
          align-items: flex-end;
          justify-content: center;
          animation: fadeIn 0.18s;
        }
        .settings-panel {
          width: 100%;
          max-width: 480px;
          background: var(--app-surface);
          border-radius: 18px 18px 0 0;
          padding: 8px 16px 28px;
          animation: slideUp 0.22s cubic-bezier(0.32, 0.72, 0.34, 1);
          display: flex;
          flex-direction: column;
          gap: 6px;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .sheet-handle {
          width: 40px;
          height: 4px;
          background: var(--app-border);
          border-radius: 2px;
          margin: 4px auto 12px;
        }
        .sheet-title {
          font-size: 14px;
          font-weight: 600;
          color: var(--app-text);
          padding: 0 4px 8px;
        }
        .settings-action {
          display: flex;
          align-items: center;
          gap: 12px;
          padding: 14px 12px;
          background: var(--app-surface-2);
          border: none;
          border-radius: 12px;
          font-size: 14px;
          color: var(--app-text);
          cursor: pointer;
          text-align: left;
          font-family: inherit;
        }
        .settings-action:active { transform: scale(0.98); background: var(--app-border-soft); }
        .settings-action.danger { color: var(--buy); }
        .settings-action svg { flex-shrink: 0; }
        .settings-action-text { flex: 1; }
        .settings-action-text > div:first-child { font-weight: 600; }
        .settings-action-sub { font-size: 11.5px; color: var(--app-text-3); margin-top: 2px; font-weight: 400; }

        .settings-action.highlight {
          background: linear-gradient(135deg, #EEF0FF 0%, #DCE0FF 100%);
          border: 1px solid #C7CCFF;
          color: var(--accent-deep);
        }
        .settings-action.highlight:active {
          background: linear-gradient(135deg, #DCE0FF 0%, #C7CCFF 100%);
        }
        .backup-section {
          display: flex;
          flex-direction: column;
          gap: 6px;
          margin-bottom: 4px;
        }
        .backup-section-title {
          font-size: 11px;
          font-weight: 600;
          color: var(--app-text-3);
          padding: 8px 4px 2px;
          text-transform: uppercase;
          letter-spacing: 0.06em;
        }

        /* ===== 동 필터 (가로 스크롤) ===== */
        .dong-filter {
          margin: 0 -0px 10px;
          overflow-x: auto;
          scrollbar-width: none;
          padding: 4px 0 8px;
        }
        .dong-filter::-webkit-scrollbar { display: none; }
        .dong-filter-inner {
          display: inline-flex;
          gap: 6px;
          padding: 0 16px;
        }
        .dong-pill {
          flex-shrink: 0;
          padding: 7px 13px;
          border: 1px solid var(--app-border-soft);
          background: var(--app-surface);
          border-radius: 999px;
          font-size: 12px;
          color: var(--app-text-2);
          cursor: pointer;
          display: inline-flex;
          align-items: center;
          gap: 5px;
          font-family: inherit;
          font-weight: 500;
          transition: all 0.12s;
          white-space: nowrap;
        }
        .dong-pill:active { transform: scale(0.95); }
        .dong-pill.active {
          background: var(--app-text);
          color: white;
          border-color: var(--app-text);
          box-shadow: 0 2px 8px rgba(15, 23, 42, 0.18);
        }
        .pill-count {
          font-size: 10px;
          opacity: 0.65;
          font-weight: 400;
          background: rgba(255,255,255,0.15);
          padding: 1px 5px;
          border-radius: 6px;
        }
        .dong-pill:not(.active) .pill-count { background: var(--app-surface-2); color: var(--app-text-3); }

        /* ===== Card list ===== */
        .card-list {
          display: flex;
          flex-direction: column;
          gap: 8px;
          padding: 0 16px;
        }
        .list-hint {
          display: flex;
          align-items: center;
          gap: 4px;
          font-size: 11px;
          color: var(--app-text-3);
          padding: 0 4px 4px;
          line-height: 1;
        }
        .list-end {
          text-align: center;
          color: var(--app-text-3);
          font-size: 11px;
          padding: 14px 0 0;
          letter-spacing: 0.05em;
        }
        .loading {
          text-align: center;
          padding: 4rem 0;
          color: var(--app-text-3);
          font-size: 13px;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 12px;
        }
        .spinner {
          width: 24px; height: 24px;
          border: 2.5px solid var(--app-border);
          border-top-color: var(--accent);
          border-radius: 50%;
          animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        .empty-state {
          text-align: center;
          padding: 4rem 1rem;
          color: var(--app-text-3);
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 8px;
        }
        .empty-title { font-size: 14px; color: var(--app-text-2); font-weight: 500; margin-top: 4px; }
        .empty-sub { font-size: 12px; }

        /* ===== Card ===== */
        .danji-card {
          display: flex;
          align-items: stretch;
          background: var(--app-surface);
          border: 1px solid var(--app-border-soft);
          border-radius: 14px;
          padding: 12px 12px 12px 6px;
          gap: 8px;
          cursor: pointer;
          transition: transform 0.15s, box-shadow 0.18s, border-color 0.15s;
          position: relative;
          touch-action: pan-y;
          box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
        }
        .danji-card:active { transform: scale(0.99); border-color: var(--app-border); }
        .danji-card.lifted {

        }
        .dong-tag {
          display: inline-flex;
          align-items: center;
          gap: 3px;
          font-size: 11px;
          color: var(--app-text-3);
          font-weight: 500;
        }
        .score-tag {
          font-size: 11px;
          padding: 2px 8px;
          border-radius: 999px;
          font-weight: 700;
          display: inline-flex;
          align-items: center;
          gap: 3px;
          letter-spacing: -0.01em;
          line-height: 1.4;
        }
        .card-name {
          font-size: 14.5px;
          font-weight: 600;
          color: var(--app-text);
          margin-bottom: 7px;
          word-break: break-word;
          line-height: 1.3;
          letter-spacing: -0.01em;
        }
        .card-meta {
          display: flex;
          gap: 4px;
          flex-wrap: wrap;
          margin-bottom: 4px;
        }
        .badge {
          font-size: 10.5px;
          padding: 3px 7px;
          border-radius: 6px;
          background: var(--app-surface-2);
          color: var(--app-text-2);
          display: inline-flex;
          align-items: center;
          gap: 3px;
          font-weight: 500;
          line-height: 1.3;
        }
        .badge.year-recent { background: var(--warn-soft); color: var(--warn); }
        .badge.year-mid    { background: var(--good-soft); color: var(--good); }
        .badge.year-old    { background: var(--app-surface-2); color: var(--app-text-2); }
        .badge.big { background: var(--buy-soft); color: var(--buy); font-weight: 600; }
        .badge.alt { background: #EEF0FF; color: var(--accent-deep); }
        .card-pyung {
          font-size: 11px;
          color: var(--app-text-3);
          margin-top: 3px;
          line-height: 1.4;
        }

        .card-actions {
          display: flex;
          flex-direction: column;
          gap: 3px;
          align-items: center;
          justify-content: center;
          flex-shrink: 0;
        }
        .move-btn {
          width: 26px; height: 26px;
          border-radius: 7px;
          border: 1px solid var(--app-border-soft);
          background: var(--app-surface);
          display: flex;
          align-items: center;
          justify-content: center;
          color: var(--app-text-2);
          cursor: pointer;
          padding: 0;
          transition: all 0.12s;
        }
        .move-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .move-btn:not(:disabled):active { background: var(--app-surface-2); transform: scale(0.88); }
        .grip { color: var(--app-text-3); padding: 2px; opacity: 0.6; }

        /* ===== Detail screen ===== */
        .detail-screen-wrap { background: var(--app-bg); min-height: 100vh; }
        .detail-screen { padding: 0 16px 32px; }
        .detail-header {
          display: flex;
          align-items: center;
          gap: 8px;
          padding: 14px 0 4px;
        }
        .back-btn {
          width: 38px; height: 38px;
          border-radius: 11px;
          border: 1px solid var(--app-border-soft);
          background: var(--app-surface);
          display: flex;
          align-items: center;
          justify-content: center;
          color: var(--app-text);
          cursor: pointer;
          flex-shrink: 0;
        }
        .back-btn:active { background: var(--app-surface-2); transform: scale(0.94); }
        .detail-title { flex: 1; min-width: 0; }
        .detail-dong {
          display: inline-flex;
          align-items: center;
          gap: 3px;
          font-size: 11px;
          color: var(--app-text-3);
          font-weight: 500;
        }
        .detail-name {
          font-size: 18px;
          font-weight: 700;
          color: var(--app-text);
          margin-top: 2px;
          line-height: 1.25;
          letter-spacing: -0.02em;
        }
        .detail-score {
          font-size: 12px;
          padding: 4px 10px;
          flex-shrink: 0;
        }

        .detail-quick {
          display: flex;
          gap: 6px;
          flex-wrap: wrap;
          padding: 10px 0 14px;
        }
        .quick-item {
          display: inline-flex;
          align-items: center;
          gap: 4px;
          font-size: 12px;
          padding: 5px 11px;
          background: var(--app-surface);
          border: 1px solid var(--app-border-soft);
          border-radius: 999px;
          color: var(--app-text-2);
          font-weight: 500;
        }

        .detail-tabs {
          display: flex;
          gap: 4px;
          padding: 4px;
          background: var(--app-surface-2);
          border-radius: 11px;
          margin-bottom: 14px;
        }
        .tab {
          flex: 1;
          padding: 9px 6px;
          border: none;
          background: transparent;
          border-radius: 8px;
          font-size: 13px;
          color: var(--app-text-2);
          cursor: pointer;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 5px;
          font-family: inherit;
          font-weight: 500;
          transition: all 0.15s;
        }
        .tab.active {
          background: var(--app-surface);
          color: var(--app-text);
          font-weight: 600;
          box-shadow: 0 1px 3px rgba(15, 23, 42, 0.08);
        }
        .tab-count {
          font-size: 10.5px;
          padding: 1px 6px;
          border-radius: 6px;
          background: var(--accent-soft);
          color: var(--accent);
          font-weight: 600;
          font-variant-numeric: tabular-nums;
        }

        .detail-body { display: flex; flex-direction: column; gap: 10px; }

        .section {
          background: var(--app-surface);
          border: 1px solid var(--app-border-soft);
          border-radius: 14px;
          padding: 14px 14px 16px;
          box-shadow: 0 1px 2px rgba(15, 23, 42, 0.03);
        }
        .section-title {
          display: flex;
          align-items: center;
          gap: 6px;
          font-size: 11px;
          color: var(--app-text-3);
          margin-bottom: 12px;
          text-transform: uppercase;
          letter-spacing: 0.06em;
          font-weight: 600;
        }
        .section-body { display: flex; flex-direction: column; gap: 8px; }

        .info-row {
          display: flex;
          gap: 10px;
          align-items: flex-start;
        }
        .info-label {
          flex-shrink: 0;
          width: 76px;
          font-size: 12px;
          color: var(--app-text-3);
          padding-top: 1px;
          font-weight: 500;
        }
        .info-value {
          flex: 1;
          font-size: 13px;
          color: var(--app-text);
          line-height: 1.5;
          word-break: break-word;
        }
        .empty {
          font-size: 12px;
          color: var(--app-text-3);
          text-align: center;
          padding: 8px 0;
        }

        .school-block {
          padding: 10px 12px;
          background: var(--app-surface-2);
          border-radius: 10px;
          display: flex;
          gap: 10px;
          align-items: center;
        }
        .school-block.elem { background: var(--good-soft); }
        .school-rank {
          flex-shrink: 0;
          width: 26px;
          height: 26px;
          border-radius: 7px;
          background: var(--app-surface);
          color: var(--app-text-2);
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 11px;
          font-weight: 700;
        }
        .school-rank.elem-rank { background: white; color: var(--good); }
        .school-content { flex: 1; min-width: 0; }
        .school-name {
          font-size: 13.5px;
          font-weight: 600;
          color: var(--app-text);
          margin-bottom: 4px;
          letter-spacing: -0.01em;
        }
        .school-stats {
          display: flex;
          gap: 12px;
          flex-wrap: wrap;
          font-size: 11.5px;
          color: var(--app-text-2);
        }
        .school-stats b {
          color: var(--app-text);
          font-weight: 600;
        }
        .school-block.elem .school-name { color: #064E3B; }

        .pyung-list { display: flex; flex-direction: column; gap: 8px; }
        .pyung-card {
          padding: 12px;
          background: var(--app-surface-2);
          border-radius: 11px;
          border: 1px solid var(--app-border-soft);
        }
        .pyung-head {
          display: flex;
          justify-content: space-between;
          align-items: center;
          margin-bottom: 10px;
        }
        .pyung-size {
          font-size: 16px;
          font-weight: 700;
          color: var(--app-text);
          letter-spacing: -0.02em;
        }
        .pyung-struct {
          font-size: 11px;
          color: var(--app-text-3);
          font-weight: 500;
        }
        .pyung-grid {
          display: grid;
          grid-template-columns: repeat(2, 1fr);
          gap: 6px;
        }
        .pyung-cell {
          padding: 8px 10px;
          background: var(--app-surface);
          border-radius: 8px;
        }
        .pyung-label {
          font-size: 10px;
          color: var(--app-text-3);
          font-weight: 500;
          text-transform: uppercase;
          letter-spacing: 0.04em;
        }
        .pyung-value {
          font-size: 14px;
          font-weight: 700;
          color: var(--app-text);
          margin-top: 3px;
          letter-spacing: -0.02em;
          font-variant-numeric: tabular-nums;
        }
        .pyung-value.buy { color: var(--buy); }
        .pyung-value.rent { color: var(--rent); }
        .pyung-yield {
          display: flex;
          align-items: center;
          gap: 5px;
          font-size: 11.5px;
          color: var(--app-text-2);
          margin-top: 10px;
          padding-top: 10px;
          border-top: 1px dashed var(--app-border);
          font-weight: 500;
        }
        .pyung-yield b {
          color: var(--accent);
          font-weight: 700;
          font-size: 12.5px;
        }

        /* ===== Checklist ===== */
        .check-item {
          padding: 14px 0 16px;
          border-bottom: 1px solid var(--app-border-soft);
        }
        .check-item:last-child {
          border-bottom: none;
          padding-bottom: 4px;
        }
        .check-label {
          font-size: 13.5px;
          color: var(--app-text);
          margin-bottom: 10px;
          font-weight: 600;
          letter-spacing: -0.01em;
        }
        .check-options {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 8px;
          width: 100%;
        }
        .check-options.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
        .check-options.five { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
        .opt-btn {
          padding: 11px 6px;
          min-height: 44px;
          border: 1px solid var(--app-border);
          background: var(--app-surface);
          border-radius: 10px;
          font-size: 13px;
          color: var(--app-text-2);
          cursor: pointer;
          transition: all 0.12s;
          font-family: inherit;
          font-weight: 500;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          gap: 5px;
          width: 100%;
          text-align: center;
          line-height: 1.2;
          word-break: keep-all;
        }
        .check-options.five .opt-btn {
          font-size: 12px;
          padding: 10px 2px;
          min-height: 42px;
        }
        .opt-btn:active { transform: scale(0.96); }
        .opt-btn.active {
          background: var(--accent);
          color: white;
          border-color: var(--accent);
          font-weight: 600;
          box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }
        .opt-btn .opt-check { flex-shrink: 0; }

        .memo-input {
          width: 100%;
          padding: 12px;
          border: 1px solid var(--app-border);
          border-radius: 10px;
          background: var(--app-surface-2);
          font-family: inherit;
          font-size: 13px;
          color: var(--app-text);
          resize: vertical;
          min-height: 90px;
          line-height: 1.5;
        }
        .memo-input:focus {
          outline: none;
          background: var(--app-surface);
          border-color: var(--accent);
          box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }
        .memo-input::placeholder { color: var(--app-text-3); }

        /* ===== Import modal ===== */
        .import-overlay {
          position: fixed;
          inset: 0;
          background: rgba(15, 23, 42, 0.5);
          z-index: 200;
          display: flex;
          align-items: flex-end;
          justify-content: center;
          animation: fadeIn 0.18s;
        }
        .import-modal {
          width: 100%;
          max-width: 480px;
          background: var(--app-surface);
          border-radius: 18px 18px 0 0;
          padding: 14px 16px 24px;
          animation: slideUp 0.22s cubic-bezier(0.32, 0.72, 0.34, 1);
          display: flex;
          flex-direction: column;
          gap: 10px;
          max-height: 85vh;
          overflow-y: auto;
        }
        .import-header {
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding-bottom: 4px;
        }
        .import-title {
          font-size: 16px;
          font-weight: 700;
          color: var(--app-text);
          letter-spacing: -0.01em;
        }
        .import-help {
          font-size: 12px;
          color: var(--app-text-2);
          background: var(--accent-soft);
          padding: 10px 12px;
          border-radius: 10px;
          line-height: 1.5;
        }
        .import-help b { color: var(--accent-deep); font-weight: 700; }
        .import-textarea {
          width: 100%;
          padding: 12px;
          border: 1px solid var(--app-border);
          border-radius: 10px;
          background: var(--app-surface-2);
          font-family: ui-monospace, "SF Mono", Menlo, monospace;
          font-size: 12px;
          color: var(--app-text);
          resize: vertical;
          min-height: 120px;
          line-height: 1.5;
        }
        .import-textarea:focus {
          outline: none;
          background: var(--app-surface);
          border-color: var(--accent);
          box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }
        .import-textarea::placeholder { color: var(--app-text-3); white-space: pre; }

        .import-result {
          background: var(--app-surface-2);
          border-radius: 10px;
          padding: 12px;
          display: flex;
          flex-direction: column;
          gap: 6px;
        }
        .import-result.error {
          background: var(--buy-soft);
          color: var(--buy);
          font-size: 13px;
          padding: 12px;
        }
        .import-result-row {
          display: flex;
          justify-content: space-between;
          font-size: 13px;
          color: var(--app-text-2);
        }
        .import-result-row b {
          color: var(--app-text);
          font-weight: 700;
          font-variant-numeric: tabular-nums;
        }
        .import-result-row.warn b { color: var(--buy); }
        .import-unmatched {
          font-size: 11px;
          color: var(--buy);
          background: var(--buy-soft);
          padding: 6px 8px;
          border-radius: 6px;
          line-height: 1.5;
          word-break: break-all;
        }
        .import-warn {
          font-size: 11.5px;
          color: var(--warn);
          background: var(--warn-soft);
          padding: 7px 9px;
          border-radius: 7px;
          margin-top: 2px;
        }

        .import-actions {
          display: flex;
          gap: 8px;
          margin-top: 4px;
        }
        .import-btn {
          flex: 1;
          padding: 13px 10px;
          border: 1px solid var(--app-border);
          background: var(--app-surface);
          border-radius: 11px;
          font-size: 14px;
          color: var(--app-text-2);
          font-weight: 600;
          cursor: pointer;
          font-family: inherit;
          transition: all 0.12s;
        }
        .import-btn:active { transform: scale(0.97); }
        .import-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .import-btn.primary {
          background: var(--accent);
          color: white;
          border-color: var(--accent);
          box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
        }
        .import-btn.primary:disabled { box-shadow: none; }
      `));
}


const rootEl = document.getElementById('root');
const root = ReactDOM.createRoot(rootEl);
root.render(React.createElement(App));

</script>
</body>
</html>
